name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static and core checks
    runs-on: ubuntu-latest
    # Full validation replays frozen experiment fixtures and can exceed 10 minutes.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate repository
        run: bash scripts/validate_repository.sh

  runtime-image:
    name: Runtime image and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --tag comas-runtime-ci --file Dockerfile.flow_predictor .

      - name: Validate packaged API and CSV output without network access
        run: bash scripts/test_runtime_image.sh comas-runtime-ci
